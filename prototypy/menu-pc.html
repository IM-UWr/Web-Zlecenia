<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Menu działu na komputerze: warianty</title>
<style>
  html,body{height:100%;margin:0;font:13.5px/1.3 system-ui,'Segoe UI',sans-serif;background:#0d1830;color:#fff}
  body{display:flex;flex-direction:column}
  #pas{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;min-height:44px;padding:4px 14px;flex:none;box-sizing:border-box}
  .gr{display:inline-flex;align-items:center;gap:8px}
  .seg{display:inline-flex;border:1px solid #ffffff55}
  .seg button{padding:5px 11px;border:0;background:none;color:#fff;font:inherit;cursor:pointer;white-space:nowrap}
  .seg button+button{border-left:1px solid #ffffff55}
  .seg button:hover{background:#ffffff1f}
  .seg button[aria-pressed=true]{background:#e4a550;color:#0d1830;font-weight:700}
  select{padding:5px 8px;font:inherit;background:#fff;color:#111;border:0}
  #opis{color:#c9d0de;font-size:12.5px}
  iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
</style></head><body>
<div id="pas"><b>Menu działu, komputer</b>
  <span class="gr">Dział <select id="strona" aria-label="Dział"><option value="instytut">Instytut</option><option value="nauka">Nauka</option><option value="studia">Studia</option><option value="popularyzacja">Popularyzacja</option></select></span>
  <span class="seg" data-u="m"><button data-v="0">Obecne</button><button data-v="a">A Karty i pole</button><button data-v="b">B Karty, lista nad treścią</button><button data-v="c">C Zakładki</button><button data-v="d">D Karty z boku</button><button data-v="e">E Karty otwarte</button></span>
  <span id="opis"></span>
</div>
<iframe id="o" title="Podgląd strony działu"></iframe>
<script>
const OPISY={'0':'Dziś: wiersze grup na kolorowym pasie.','a':'Jak na telefonie: naciśnięcie karty pokazuje strony w polu pod spodem, treść się przesuwa.','b':'Najechanie albo kliknięcie otwiera listę pod kartą, nad treścią; nic się nie przesuwa.','c':'Zakładki z kreską na kolorowym pasie; pierwsza grupa otwarta.','d':'Karty jedna pod drugą z lewej, strony wybranej grupy z prawej; pierwsza grupa otwarta.','e':'Bez klikania: każda karta od razu pokazuje swoje strony.'};
const USTAW={m:(location.hash.match(/m=([0a-e])/)||[])[1]||'a'};
const R=':root:root ';
const WSZ='html:is([data-m="a"],[data-m="b"],[data-m="c"],[data-m="d"],[data-m="e"])'+R;
const CSS=`:root:root .z-dz .m-karty { display: none; }
@media (min-width: 761px) {
html:is([data-m="a"],[data-m="b"],[data-m="d"])${R}.z-dz .m-karty { display: grid; gap: 8px; }
html:is([data-m="a"],[data-m="b"])${R}.z-dz .m-karty { grid-template-columns: repeat(var(--m-n, 3), minmax(0, 1fr)); }
${WSZ}.z-dz .z-dz-rzad { padding: 0; border: 0; }
${WSZ}.z-dz .z-dz-pas { position: relative; }
/* karta */
${WSZ}.z-dz .m-k { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; min-height: 76px; margin: 0; padding: 12px 16px 11px; border: 0; border-radius: 5px; background: var(--d-t); color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: background-color var(--t-krotki) var(--rytm), color var(--t-krotki) var(--rytm); }
${WSZ}.z-dz .m-k b { font-family: var(--f-display); font-weight: 500; font-size: 21px; line-height: 1.15; }
${WSZ}.z-dz .m-k small { font-size: 12.5px; font-weight: 600; color: var(--d-a); }
${WSZ}.z-dz .m-k:hover { background: color-mix(in srgb, var(--d-a) 14%, var(--d-t)); }
${WSZ}.z-dz .m-k[aria-expanded="true"] { background: var(--d-a); color: var(--bg); }
${WSZ}.z-dz .m-k[aria-expanded="true"] small { color: inherit; opacity: .85; }
/* Rekrutacja na Studiach zostaje na komputerze, jako ostatni element rzędu */
${WSZ}.z-dz .z-dz-rekr { border-radius: 5px; }

/* A: karty i pole pod spodem */
html[data-m="a"]${R}.z-dz .z-dz-pas { display: grid; grid-template-columns: minmax(0, 1fr); padding: 18px var(--marg) 0; background: transparent; column-gap: 8px; }
html[data-m="a"]${R}.z-dz .z-dz-pas:has(.z-dz-rekr) { grid-template-columns: minmax(0, 1fr) auto; }
html[data-m="a"]${R}.z-dz .m-karty { grid-column: 1; grid-row: 1; }
html[data-m="a"]${R}.z-dz .z-dz-rekr { grid-column: 2; grid-row: 1; justify-content: center; }
html[data-m="a"]${R}.z-dz .z-dz-rzedy { grid-column: 1 / -1; grid-row: 2; }
html[data-m="a"]${R}.z-dz .z-dz-rzad:not(.m-akt) { display: none; }
html[data-m="a"]${R}.z-dz .z-dz-rzad h3 { display: none; }
html[data-m="a"]${R}.z-dz .z-dz-rzad.m-akt { display: block; margin-top: 12px; padding: 12px 18px; border-radius: 5px; background: var(--d-t); }
html[data-m="a"]${R}.z-dz .m-k[aria-expanded="true"]::after { content: ''; position: absolute; left: 24px; bottom: -7px; width: 14px; height: 14px; background: var(--d-a); transform: rotate(45deg); }

/* B: karty, lista nad treścią */
html[data-m="b"]${R}.z-dz .z-dz-pas { display: grid; grid-template-columns: minmax(0, 1fr); padding: 18px var(--marg) 0; background: transparent; column-gap: 8px; }
html[data-m="b"]${R}.z-dz .z-dz-pas:has(.z-dz-rekr) { grid-template-columns: minmax(0, 1fr) auto; }
html[data-m="b"]${R}.z-dz .m-karty { grid-column: 1; grid-row: 1; }
html[data-m="b"]${R}.z-dz .z-dz-rekr { grid-column: 2; grid-row: 1; justify-content: center; }
html[data-m="b"]${R}.z-dz .z-dz-rzedy { display: contents; }
html[data-m="b"]${R}.z-dz .z-dz-rzad:not(.m-akt) { display: none; }
html[data-m="b"]${R}.z-dz .z-dz-rzad h3 { display: none; }
html[data-m="b"]${R}.z-dz .z-dz-rzad.m-akt { display: block; position: absolute; z-index: 15; top: var(--m-y, 100px); left: var(--m-x, 0); width: var(--m-w, 320px); box-sizing: border-box; padding: 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); box-shadow: 0 10px 28px rgb(13 24 48 / .18); }
html[data-m="b"]${R}.z-dz .z-dz-rzad ul { display: block; }
html[data-m="b"]${R}.z-dz .z-dz-rzad a { display: block; margin: 0; padding: 6px 10px; white-space: normal; }

/* C: zakładki z kreską */
html[data-m="c"]${R}.z-dz .z-dz-pas { display: grid; grid-template-columns: minmax(0, 1fr); padding: 6px var(--marg) 12px; column-gap: 24px; }
html[data-m="c"]${R}.z-dz .z-dz-pas:has(.z-dz-rekr) { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
html[data-m="c"]${R}.z-dz .m-karty { display: flex; gap: 30px; grid-column: 1; grid-row: 1; border-bottom: 1px solid color-mix(in srgb, var(--d-a) 28%, transparent); }
html[data-m="c"]${R}.z-dz .z-dz-rzedy { grid-column: 1; grid-row: 2; }
html[data-m="c"]${R}.z-dz .z-dz-rekr { grid-column: 2; grid-row: 1 / span 2; }
html[data-m="c"]${R}.z-dz .m-k { min-height: 46px; padding: 8px 2px 10px; border-radius: 0; background: none; color: var(--muted); justify-content: center; }
html[data-m="c"]${R}.z-dz .m-k:hover { background: none; color: var(--ink); }
html[data-m="c"]${R}.z-dz .m-k small { display: none; }
html[data-m="c"]${R}.z-dz .m-k[aria-expanded="true"] { background: linear-gradient(var(--d-a), var(--d-a)) bottom / 100% 3px no-repeat; color: var(--ink); }
html[data-m="c"]${R}.z-dz .z-dz-rzad:not(.m-akt) { display: none; }
html[data-m="c"]${R}.z-dz .z-dz-rzad h3 { display: none; }
html[data-m="c"]${R}.z-dz .z-dz-rzad.m-akt { display: block; padding: 12px 0 2px; }

/* D: karty z boku */
html[data-m="d"]${R}.z-dz .z-dz-pas { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 8px 12px; align-items: stretch; padding: 18px var(--marg) 0; background: transparent; }
html[data-m="d"]${R}.z-dz .z-dz-pas:has(.z-dz-rekr) { grid-template-columns: 300px minmax(0, 1fr) auto; }
html[data-m="d"]${R}.z-dz .m-karty { grid-template-columns: minmax(0, 1fr); gap: 6px; }
html[data-m="d"]${R}.z-dz .m-k { flex-direction: row; align-items: baseline; min-height: 46px; padding: 10px 14px; }
html[data-m="d"]${R}.z-dz .m-k small { flex: none; }
html[data-m="d"]${R}.z-dz .z-dz-rzedy { display: flex; align-items: stretch; }
html[data-m="d"]${R}.z-dz .z-dz-rzad:not(.m-akt) { display: none; }
html[data-m="d"]${R}.z-dz .z-dz-rzad h3 { display: none; }
html[data-m="d"]${R}.z-dz .z-dz-rzad.m-akt { display: block; flex: 1; padding: 14px 20px; border-radius: 5px; background: var(--d-t); }

/* E: karty otwarte */
html[data-m="e"]${R}.z-dz .z-dz-pas { display: grid; grid-template-columns: minmax(0, 1fr); padding: 18px var(--marg) 0; background: transparent; column-gap: 8px; }
html[data-m="e"]${R}.z-dz .z-dz-pas:has(.z-dz-rekr) { grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; }
html[data-m="e"]${R}.z-dz .z-dz-rzedy { display: grid; grid-template-columns: repeat(var(--m-n, 3), minmax(0, 1fr)); gap: 8px; }
html[data-m="e"]${R}.z-dz .z-dz-rzad { display: block; padding: 12px 16px 12px; border-radius: 5px; background: var(--d-t); }
html[data-m="e"]${R}.z-dz .z-dz-rzad h3 { margin: 0 0 4px; }
html[data-m="e"]${R}.z-dz .z-dz-rzad ul { display: block; }
html[data-m="e"]${R}.z-dz .z-dz-rzad a { display: block; margin: 0 -10px; padding: 2px 10px 3px; white-space: normal; }
html[data-m="e"]${R}.z-dz .z-dz-rekr { justify-content: center; }
}`;
const o=document.getElementById('o'), wyb=document.getElementById('strona');
function nalozy(){
  const d=o.contentDocument; if(!d||!d.head||!d.body||d.URL==='about:blank') return;
  const e=d.documentElement;
  if(USTAW.m!=='0') e.dataset.m=USTAW.m; else delete e.dataset.m;
  if(!d.getElementById('m-styl')){const s=d.createElement('style');s.id='m-styl';s.textContent=CSS;d.head.append(s);}
  const pas=d.querySelector('.z-dz-pas'); if(!pas) return;
  const rz=[...pas.querySelectorAll('.z-dz-rzad')];
  pas.style.setProperty('--m-n',rz.length);
  const rzedy=pas.querySelector('.z-dz-rzedy');
  if(rzedy) rzedy.style.setProperty('--m-n',rz.length);
  if(!pas.querySelector('.m-karty')){
    const t=d.createElement('div');t.className='m-karty';t.style.setProperty('--m-n',rz.length);
    const pokaz=(i)=>{rz.forEach((r,j)=>r.classList.toggle('m-akt',j===i));t.querySelectorAll('.m-k').forEach((b,j)=>b.setAttribute('aria-expanded',String(j===i)));
      if(i>=0&&d.documentElement.dataset.m==='b'){const k=t.children[i].getBoundingClientRect(),p=pas.getBoundingClientRect(),sz=Math.round(Math.max(k.width,300)),mx=p.width-parseFloat(d.defaultView.getComputedStyle(pas).paddingRight)-sz;rz[i].style.setProperty('--m-x',Math.round(Math.min(k.left-p.left,mx))+'px');rz[i].style.setProperty('--m-y',Math.round(k.bottom-p.top+6)+'px');rz[i].style.setProperty('--m-w',sz+'px');}};
    let czas=0;
    rz.forEach((r,i)=>{const b=d.createElement('button');b.type='button';b.className='m-k';b.setAttribute('aria-expanded','false');const n=r.querySelectorAll('a').length;b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=r.querySelector('h3').textContent;b.querySelector('small').textContent=n+(n===1?' strona':n<=4?' strony':' stron');
      b.addEventListener('click',()=>pokaz(r.classList.contains('m-akt')&&d.documentElement.dataset.m!=='d'&&d.documentElement.dataset.m!=='c'?-1:i));
      b.addEventListener('mouseenter',()=>{if(d.documentElement.dataset.m==='b'){clearTimeout(czas);pokaz(i);}});
      b.addEventListener('mouseleave',()=>{if(d.documentElement.dataset.m==='b'){czas=setTimeout(()=>pokaz(-1),180);}});
      r.addEventListener('mouseenter',()=>{if(d.documentElement.dataset.m==='b')clearTimeout(czas);});
      r.addEventListener('mouseleave',()=>{if(d.documentElement.dataset.m==='b')czas=setTimeout(()=>pokaz(-1),180);});
      t.append(b);});
    pas.insertBefore(t,pas.querySelector('.z-dz-rzedy'));pas.__mPokaz=pokaz;
  }
  if(pas.dataset.mTryb!==USTAW.m){pas.dataset.mTryb=USTAW.m;pas.__mPokaz((USTAW.m==='c'||USTAW.m==='d')?0:-1);}
}
function odswiez(){document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===USTAW.m)));document.getElementById('opis').textContent=OPISY[USTAW.m];}
function czuwaj(){const t=setInterval(()=>{let d;try{d=o.contentDocument}catch(x){return} if(d&&d.head&&d.body&&d.URL!=='about:blank'&&!d.getElementById('m-styl')){clearInterval(t);nalozy();o.contentWindow.addEventListener('pagehide',czuwaj,{once:true});}},40);setTimeout(()=>clearInterval(t),15000);}
document.querySelector('.seg').addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;USTAW.m=x.dataset.v;odswiez();nalozy();});
function idz(v){o.src='/Web-Core/'+v;czuwaj();}
wyb.addEventListener('change',()=>idz(wyb.value));
o.addEventListener('load',nalozy);
const pocz=(location.hash.match(/s=([a-z]+)/)||[])[1]||'instytut';wyb.value=pocz;odswiez();idz(pocz);
window.__U=USTAW;window.__idz=idz;window.__nalozy=nalozy;window.__odswiez=odswiez;
</script>
</body></html>
